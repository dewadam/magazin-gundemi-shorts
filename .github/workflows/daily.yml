name: Daily Magazin News Collection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  schedule:
    # 06:15 UTC = 09:15 Türkiye saati (UTC+3)
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-magazin-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run event-matching regression tests
        run: python -m unittest discover -s tests -v

      - name: Collect Google News and web-index candidates
        run: python src/news_collector.py

      - name: Search publisher coverage and rank distinct events
        run: python src/news_ranker.py

      - name: Check source pages and create verification queue
        run: python src/news_verifier.py

      - name: Commit collected news
        if: github.event_name != 'push'
        run: |
          if [ -f data/news_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news_latest.json data/selected_news.json data/verification_queue.json
            if ! git diff --cached --quiet; then
              git commit -m "Update collected magazine news"
              git push
            else
              echo "No output changes to commit."
            fi
          else
            echo "Expected output file was not created."
            exit 1
          fi
