name: Daily Magazin Shorts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "15 6 * * *" # 09:15 Türkiye saati
permissions:
  contents: write
concurrency:
  group: daily-magazin-shorts
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect Google News candidates
        run: python src/news_collector.py
      - name: Find coverage and rank distinct events
        run: python src/news_ranker.py
      - name: Check source pages
        run: python src/news_verifier.py
      - name: Generate up to three vertical Shorts
        run: python src/shorts_builder.py
        env:
          TTS_VOICE: tr-TR-EmelNeural
          YOUTUBE_PRIVACY_STATUS: public
      - name: Upload to YouTube if OAuth token is configured
        env:
          YOUTUBE_TOKEN_JSON: \${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python src/youtube_uploader.py
      - name: Save videos and reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magazin-gundemi-shorts-\${{ github.run_number }}
          path: |
            output/
            data/news_latest.json
            data/selected_news.json
            data/verification_queue.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit collected news reports
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_latest.json data/selected_news.json data/verification_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily magazine news reports" || true
            git push || echo "Reports saved as artifact; branch push was not possible."
          else
            echo "No report changes to commit."
          fi
