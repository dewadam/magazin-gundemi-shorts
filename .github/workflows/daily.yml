name: Daily Magazin News Collection

on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC = 09:15 Türkiye saati (UTC+3)
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-magazin-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect RSS news
        run: python src/news_collector.py

      - name: Rank and select three distinct stories
        run: python src/news_ranker.py

      - name: Commit collected news
        run: |
          if [ -f data/news_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news_latest.json data/selected_news.json
            if ! git diff --cached --quiet; then
              git commit -m "Update collected magazine news"
              git push
            else
              echo "No output changes to commit."
            fi
          else
            echo "Expected output file was not created."
            exit 1
          fi
