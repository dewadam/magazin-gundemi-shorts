name: Hook Engine Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/hook_engine.py"
      - "src/shorts_builder.py"
      - "tests/test_hook_engine.py"
      - ".github/workflows/hook-engine-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Hook Engine tests
        run: python -m unittest discover -s tests -p 'test_hook_engine.py' -v
